<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack's Portfolio</title>

    <!-- เพิ่ม Google Font ชื่อ Bangers (ฟ้อนต์แนวการ์ตูน Adventure Time) -->
    <!-- link rel="preconnect" ช่วยให้ browser เชื่อมต่อ Google server ล่วงหน้า ทำให้โหลดเร็วขึ้น -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ดึง font Bangers และ Nunito มาใช้ -->
    <!-- Bangers → หัวข้อ, Nunito → เนื้อหา (อ่านง่าย น่ารัก) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
